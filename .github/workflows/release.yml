name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-14
            name: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.name }}" = "macos-universal" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp build/claude-sync "dist/claude-sync-${{ matrix.name }}"
          chmod +x "dist/claude-sync-${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: claude-sync-${{ matrix.name }}
          path: dist/claude-sync-${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Channel is decided by ref: a vX.Y.Z tag is a pinned release, main
      # publishes to the moving "latest" tag, anything else to "test".
      - name: Decide what this build publishes as
        id: which
        env:
          SHA: ${{ github.sha }}
        run: |
          short="${SHA:0:7}"
          today=$(date -u +%Y-%m-%d)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "name=latest (main @ ${short}, ${today})" >> "$GITHUB_OUTPUT"
          else
            echo "tag=test" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "name=test build (${{ github.ref_name }} @ ${short}, ${today})" >> "$GITHUB_OUTPUT"
          fi

      # Delete before recreating -- action-gh-release won't move an existing tag.
      - name: Move the moving tag
        if: steps.which.outputs.tag == 'latest' || steps.which.outputs.tag == 'test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.which.outputs.tag }}" --yes --cleanup-tag || true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.which.outputs.tag }}
          name: ${{ steps.which.outputs.name }}
          prerelease: ${{ steps.which.outputs.prerelease }}
          make_latest: ${{ steps.which.outputs.make_latest }}
          generate_release_notes: true
          files: dist/*
